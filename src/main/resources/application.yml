server:
  port: 8080

spring:
  application:
    name: gateway
  reactor:
    context-propagation: auto
  codec:
    max-in-memory-size: 1MB

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:4200"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                  - Idempotency-Key
                  - X-Requested-With
                exposedHeaders:
                  - Content-Type
                allowCredentials: false

          routes:

            - id: auth-service
              uri: http://identity-service:8084
              predicates:
                - Path=/api/auth/**

            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/users/**

            - id: policy-service
              uri: http://policy-service:8082
              predicates:
                - Path=/api/policies/**

            - id: claim-service
              uri: http://claim-service:8083
              predicates:
                - Path=/api/claims/**

            - id: realtime-claim
              uri: http://claim-service:8083
              predicates:
                - Path=/ws/**

            - id: claim-socketio
              uri: http://claim-service:8083
              predicates:
                - Path=/socket.io/**

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    reactor.netty: WARN
  structured:
    format:
      console: logstash

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  
  endpoint:
    health:
      show-details: never

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

  tracing:
    enabled: true
    sampling:
      probability: 1.0
